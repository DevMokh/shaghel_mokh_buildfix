name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaghel-mokh-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Generate Android platform files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shaghel-mokh-source
          cp -a lib /tmp/shaghel-mokh-source/lib
          cp -a pubspec.yaml /tmp/shaghel-mokh-source/pubspec.yaml
          if [ -d test ]; then cp -a test /tmp/shaghel-mokh-source/test; fi
          flutter create . \
            --org com.shaghelmokh \
            --project-name shaghel_mokh \
            --platforms android \
            --no-pub
          rm -rf lib
          cp -a /tmp/shaghel-mokh-source/lib lib
          cp -a /tmp/shaghel-mokh-source/pubspec.yaml pubspec.yaml
          if [ -d /tmp/shaghel-mokh-source/test ]; then
            rm -rf test
            cp -a /tmp/shaghel-mokh-source/test test
          else
            rm -rf test
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Show build toolchain
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Apply Android overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f android_overlay/AndroidManifest.xml
          test -f android_overlay/MainActivity.kt
          test -f android_overlay/google-services.json
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/shaghelmokh/shaghel_mokh
          find android/app/src/main -type f \( -name MainActivity.java -o -name MainActivity.kt \) -delete
          cp android_overlay/MainActivity.kt android/app/src/main/kotlin/com/shaghelmokh/shaghel_mokh/MainActivity.kt
          cp -R android_overlay/res/. android/app/src/main/res/

      - name: Configure and validate Firebase Android app
        run: python3 tool/configure_android_firebase.py

      - name: Verify Android package and Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/google-services.json
          grep -R 'com.shaghelmokh.shaghel_mokh' android/app/build.gradle* >/dev/null
          grep -R 'com.google.gms.google-services' android/settings.gradle* android/app/build.gradle* >/dev/null

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        if: ${{ hashFiles('test/**') != '' }}
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: shaghel-mokh-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shaghel-mokh-build-diagnostics
          path: |
            build/**/outputs/**
            android/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
